[project]
name = "linux-mcp"
version = "0.1.0"
description = "MCP server exposing Linux system control tools to an LLM agent"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
desktop = ["pyautogui>=0.9.54", "mss>=9.0"]   # only needed if desktop.py tools are enabled
browser = ["playwright>=1.44"]                 # only needed if browser.py tools are enabled

[project.scripts]
linux-mcp = "linux_mcp.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
